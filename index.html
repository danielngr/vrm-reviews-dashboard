let mergedHTML = null;

document.getElementById('fileIn').addEventListener('change', e => processFile(e.target.files[0]));
document.getElementById('dropZone').addEventListener('dragover', e => {e.preventDefault(); e.currentTarget.style.borderColor='#4a8c6f'});
document.getElementById('dropZone').addEventListener('dragleave', e => e.currentTarget.style.borderColor='#c8a96e');
document.getElementById('dropZone').addEventListener('drop', e => {e.preventDefault(); e.currentTarget.style.borderColor='#c8a96e'; processFile(e.dataTransfer.files[0])});

function makeKey(r) {
  const name = (r.huesped||'').split(' ')[0].toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  return r.fecha + '|' + name + '|' + r.general;
}

function processFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const html = e.target.result;
    const st = document.getElementById('status');
    const dt = document.getElementById('details');
    
    const match = html.match(/const DATA=(\[.*?\]);\s*\n/s);
    if (!match) {
      st.className = 'status err';
      st.textContent = '❌ No se encontró const DATA=[...] en el archivo';
      return;
    }
    
    try {
      const oldData = JSON.parse(match[1]);
      const oldCount = oldData.length;
      
      // Build lookup of existing reviews (with subcats)
      const existingKeys = new Set(oldData.map(makeKey));
      
      // For scrape reviews that MATCH old data: skip (old has subcats)
      // For scrape reviews that DON'T match: add them (new reviews)
      let added = 0;
      let skippedDup = 0;
      let noSubcats = 0;
      const newEntries = [];
      
      SCRAPE_REVIEWS.forEach(r => {
        const key = makeKey(r);
        if (existingKeys.has(key)) {
          skippedDup++;
        } else {
          // New review - add it
          newEntries.push(r);
          added++;
          if (!r.llegada && !r.limpieza) noSubcats++;
        }
      });
      
      // Also check: old reviews NOT in scrape (keep them!)
      const scrapeKeys = new Set(SCRAPE_REVIEWS.map(makeKey));
      let onlyInOld = 0;
      oldData.forEach(r => {
        if (!scrapeKeys.has(makeKey(r))) onlyInOld++;
      });
      
      // Merge: old data + new entries
      const merged = [...oldData, ...newEntries];
      merged.sort((a,b) => (a.fecha||'').localeCompare(b.fecha||''));
      
      // Replace DATA in HTML
      const newDataStr = JSON.stringify(merged);
      mergedHTML = html.replace(/const DATA=(\[.*?\]);\s*\n/s, 'const DATA=' + newDataStr + ';\n');
      
      st.className = 'status ok';
      st.textContent = '✅ Merge exitoso! ' + oldCount + ' → ' + merged.length + ' reviews (+' + added + ' nuevas)';
      
      dt.className = 'status info';
      dt.innerHTML = '<strong>Detalles:</strong><br>' +
        '📊 Reviews en dashboard viejo: ' + oldCount + ' (con subcategorías)<br>' +
        '📊 Reviews en scrape nuevo: ' + SCRAPE_REVIEWS.length + '<br>' +
        '🔄 Duplicados (ya existían): ' + skippedDup + '<br>' +
        '✨ Reviews nuevas agregadas: ' + added + '<br>' +
        '📅 Solo en dashboard viejo: ' + onlyInOld + ' (conservadas)<br>' +
        '⚠️ Sin subcategorías: ' + noSubcats + ' (necesitan Phase 2)<br>' +
        '📅 Rango final: ' + merged[0].fecha + ' → ' + merged[merged.length-1].fecha;
      
      document.getElementById('dlBtn').disabled = false;
      
    } catch(err) {
      st.className = 'status err';
      st.textContent = '❌ Error: ' + err.message;
    }
  };
  reader.readAsText(file);
}

function downloadMerged() {
  if (!mergedHTML) return;
  const blob = new Blob([mergedHTML], {type: 'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'index.html';
  a.click();
}
</script>
